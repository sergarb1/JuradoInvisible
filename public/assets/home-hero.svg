<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Portada: la sombra de un juez invisible en un aula vacía">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16213b"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- window (left, cool light) -->
  <g transform="translate(70,110)">
    <rect width="150" height="210" rx="10" fill="#0b1220"/>
    <rect x="8" y="8" width="134" height="194" rx="6" fill="url(#window)"/>
    <rect x="70" y="8" width="10" height="194" fill="#0b1220"/>
    <rect x="8" y="100" width="134" height="10" fill="#0b1220"/>
    <!-- moon -->
    <circle cx="110" cy="52" r="18" fill="url(#moon)"/>
  </rect>

  <!-- floor shadow -->
  <ellipse cx="300" cy="560" rx="250" ry="30" fill="#050a1600" opacity="0"/>
  <path d="M120 470 L600 380 L600 600 L120 600 Z" fill="url(#floor)"/>

  <!-- chalkboard line back -->
  <rect x="330" y="150" width="220" height="150" rx="6" fill="#0ea5b0" opacity="0.05"/>
  <rect x="340" y="158" width="200" height="134" rx="4" fill="#020617"/>
  <text x="440" y="230" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#334155" opacity="0.9">¿quién decide?</text>

  <!-- empty chair left -->
  <g transform="translate(210,330)" opacity="0.85">
    <rect x="0" y="18" width="60" height="12" rx="4" fill="#475569"/>
    <rect x="46" y="0" width="16" height="22" rx="4" fill="#475569"/>
    <rect x="0" y="30" width="7" height="30" fill="#334155"/>
    <rect x="52" y="30" width="7" height="30" fill="#334155"/>
  </g>
  <!-- empty chair right -->
  <g transform="translate(120,360) scale(0.8)" opacity="0.6">
    <rect x="0" y="18" width="60" height="12" rx="4" fill="#334155"/>
    <rect x="46" y="0" width="16" height="22" rx="4" fill="#334155"/>
    <rect x="0" y="30" width="7" height="30" fill="#1e293b"/>
    <rect x="52" y="30" width="7" height="30" fill="#1e293b"/>
  </g>

  <!-- the invisible judge: shadow without a body, small balance scale -->
  <g transform="translate(370,150)">
    <!-- dark figure shadow -->
    <ellipse cx="0" cy="330" rx="16" ry="6" fill="#050a16"/>
    <path d="M-18 330 C-20 220 8 150 34 130 C58 148 60 230 26 330 Z" fill="#0b1220" opacity="0.95" filter="url(#shadow)"/>
    <path d="M-16 330 C-18 228 6 156 30 132 C52 150 54 232 22 330 Z" fill="#0f172a"/>
    <!-- balance scale in its hand -->
    <g transform="translate(40,120)">
      <rect x="0" y="0" width="26" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="11" y="5" width="4" height="18" fill="#94a3b8"/>
      <path d="M-14 5 L13 5 L-4 26 Z" fill="#cbd5e1"/>
      <path d="M40 5 L13 5 L30 26 Z" fill="#cbd5e1"/>
      <!-- shadows inside pans -->
      <path d="M-11 5 L11 5 L-2 24 Z" fill="#475569"/>
      <path d="M39 5 L15 5 L28 24 Z" fill="#475569"/>
    </g>
  </g>

  <!-- film corner vignette -->
  <rect width="600" height="600" fill="url(#shadow)" opacity="0.1"/>
  <ellipse cx="300" cy="300" rx="300" ry="300" fill="none" stroke="#0b1220" stroke-width="2" opacity="0.4"/>
</svg>