<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Portada del caso: un alumno solo en el pasillo del instituto">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- corridor one-point perspective -->
  <!-- floor -->
  <path d="M0 720 L640 470 L1280 720 Z" fill="url(#floor)"/>
  <!-- walls converge -->
  <path d="M0 150 L640 470 L0 720 Z" fill="#16213b" opacity="0.6"/>
  <path d="M1280 150 L640 470 L1280 720 Z" fill="#1c2740" opacity="0.6"/>

  <!-- windows on right wall (receding) -->
  <g fill="url(#light)">
    <rect x="860" y="250" width="70" height="150" rx="4"/>
    <rect x="1010" y="230" width="74" height="150" rx="4"/>
    <rect x="1148" y="214" width="80" height="150" rx="4"/>
  </g>
  <!-- window frames -->
  <g stroke="#020617" stroke-width="6" fill="none" opacity="0.5">
    <rect x="860" y="250" width="70" height="150" rx="4"/>
    <rect x="1010" y="230" width="74" height="150" rx="4"/>
    <rect x="1140" y="214" width="80" height="150" rx="4"/>
  </g>

  <!-- groups far away at the window, vague -->
  <g fill="#0f172a" opacity="0.55">
    <circle cx="1090" cy="470" r="16"/>
    <circle cx="1112" cy="476" r="15"/>
    <circle cx="1075" cy="476" r="13"/>
    <path d="M1082 470 Q1090 500 1090 520 L1090 520 L1078 520 Z"/>
    <circle cx="1185" cy="462" r="15"/>
    <circle cx="982" cy="478" r="12"/>
  </g>
  <g fill="#0f172a" opacity="0.7">
    <path d="M1070 520 L1110 520 L1110 500 C1096 500 1082 506 1070 500 Z" />
  </g>

  <!-- the invisible student (soft, slightly out of focus) -->
  <g transform="translate(560,430)" opacity="0.97" filter="blur(1.4px)">
    <ellipse cx="0" cy="200" rx="46" ry="8" fill="#050a16"/>
    <circle cx="0" cy="120" r="30" fill="#c7b49c"/>
    <path d="M-30 120 C-30 78 -16 70 0 70 C16 70 30 78 30 120 C22 100 0 102 0 120 C4 108 20 104 26 112 C20 82 -8 78 -26 96 Z" fill="#22303f"/>
    <path d="M-30 52 L30 52 L34 -8 L-34 -8 Z" fill="#22303f"/>
    <path d="M-56 68 C-40 56 -16 50 0 50 C16 50 62 72 74 122 L44 122 C30 78 14 74 0 74 C-16 74 -26 88 -34 122 L-66 122 C-70 100 -62 80 -56 68 Z" fill="#334155"/>
    <path d="M-40 200 L40 200 L40 150 L-40 150 Z" fill="#334155"/>
  </g>

  <!-- row of lockers lower-left -->
  <g transform="translate(60,400)" fill="none" stroke="#111827" stroke-width="3" opacity="0.5">
    <rect x="0" y="0" width="90" height="120" rx="4"/>
    <rect x="94" y="0" width="90" height="120" rx="4"/>
    <rect x="188" y="0" width="90" height="120" rx="4"/>
  </g>

  <!-- dark vignette corners -->
  <rect width="1280" height="720" fill="url(#sky)" opacity="0"/>
  <ellipse cx="40" cy="360" rx="220" ry="360" fill="#020617" opacity="0.45"/>
</svg>