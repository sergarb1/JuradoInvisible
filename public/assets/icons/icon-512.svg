<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Icono: la balanza del jurado invisible">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#g)"/>

  <!-- balance -->
  <g>
    <!-- beam -->
    <rect x="86" y="176" width="340" height="26" rx="13" fill="#cbd5e1"/>
    <!-- pivot -->
    <path d="M246 202 L266 202 L260 242 L252 242 Z" fill="#64748b"/>
    <!-- chains + pans -->
    <path d="M100 202 L100 260 M122 202 L122 246" stroke="#94a3b8" stroke-width="8"/>
    <path d="M390 202 L390 260 M412 202 L412 246" stroke="#94a3b8" stroke-width="8"/>
    <path d="M82 260 L140 260 L152 300 L70 300 Z" fill="#e2e8f0"/>
    <path d="M370 260 L428 260 L440 300 L358 300 Z" fill="#e2e8f0"/>
  </g>

  <!-- the shadow of the group -->
  <g fill="#1e293b" opacity="0.95">
    <!-- a small human figure whose shadow is the group -->
    <path d="M108 320 L188 320 L172 302 C152 322 130 326 110 308 Z" fill="#94a3b8"/>
    <circle cx="148" cy="286" r="22" fill="#94a3b8"/>
    <path d="M126 306 C126 296 134 288 148 288 C196 288 196 340 148 340 C100 340 126 306 126 306 Z" fill="#94a3b8"/>
  </g>
  <g fill="#94a3b8" opacity="0.7">
    <circle cx="268" cy="330" r="20"/>
    <circle cx="300" cy="336" r="18"/>
    <circle cx="330" cy="332" r="16"/>
    <circle cx="360" cy="338" r="14"/>
    <path d="M250 350 L286 350 L286 380 L250 380 Z"/>
    <path d="M286 350 L316 350 L316 380 L286 380 Z"/>
    <path d="M328 350 L354 350 L354 380 L328 380 Z"/>
    <path d="M368 348 L382 348 L382 376 L368 376 Z"/>
  </g>

  <!-- ground line -->
  <path d="M60 388 L452 388" stroke="#0b1220" stroke-width="4" stroke-linecap="round"/>
</svg>