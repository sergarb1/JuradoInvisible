      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#2c0707"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#f87171" stroke-width="5" opacity="0.8"/>

