  <path d="M52 256 C52 192 80 160 128 160 C176 160 204 192 204 256 Z" fill="#4c0519"/>
  <path d="M52 256 C52 192 80 160 128 160 C176 160 204 192 204 256 Z" fill="#be123c" opacity="0.25"/>

