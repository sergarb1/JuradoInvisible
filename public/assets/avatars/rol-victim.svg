      <stop offset="0" stop-color="#5f1230"/>
      <stop offset="1" stop-color="#2b0a16"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#fb7185" stroke-width="5" opacity="0.8"/>

