  <path d="M62 256 C62 200 88 168 128 168 C168 168 194 200 194 256 Z" fill="#7f1d2e"/>
  <path d="M62 256 C62 200 88 168 128 168 C168 168 194 200 194 256 Z" fill="#be123c" opacity="0.35"/>
  <!-- folded hands -->
  <circle cx="104" cy="230" r="17" fill="#1c0a10"/>
  <circle cx="150" cy="230" r="17" fill="#1c0a10"/>

