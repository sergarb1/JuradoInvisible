<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Avatar del rol: espectador">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#5a3d0b"/>
      <stop offset="1" stop-color="#281a03"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.8"/>

  <!-- shoulders slightly turned, arms crossed -->
  <path d="M64 256 C64 200 86 168 120 168 C164 168 188 200 188 256 Z" fill="#92400e"/>
  <g stroke="#7c2d12" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M96 150 C104 186 132 194 152 186"/>
  </g>

  <!-- head turned slightly to the side -->
  <circle cx="130" cy="120" r="46" fill="#dcc9b0"/>
  <!-- hair -->
  <path d="M124 74 C80 78 76 118 84 158 C92 152 96 142 98 132 C96 120 100 96 130 92 C160 88 172 96 176 112 C180 128 178 140 172 150 C160 138 128 146 120 158 C138 120 156 92 124 74 Z" fill="#3a2a12"/>

  <!-- eyes looking to the side -->
  <g fill="#241704">
    <circle cx="112" cy="124" r="5"/>
    <circle cx="150" cy="128" r="5"/>
  </g>
  <g fill="#241704" opacity="0.7">
    <circle cx="117" cy="124" r="2"/>
    <circle cx="155" cy="128" r="2"/>
  </g>
  <!-- flat neutral mouth -->
  <path d="M120 156 Q132 158 144 156" stroke="#5c4226" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>